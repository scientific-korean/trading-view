# =============================================================
#  관심 종목 모니터 - 설정 파일
#  kind: price = PPO 사용 / rate = MACD 원값 사용(bp)
# =============================================================

params:
  # PPO / MACD
  fast: 19
  slow: 39
  signal: 14

  # RSI
  rsi_period: 14
  rsi_upper: 52        # 이 위로 올라가면 강세 존 전환 (기존 55 → 52, 매도지연 단축 목적)
  rsi_lower: 48        # 이 아래로 내려가면 약세 존 전환 (기존 45 → 48)

  # 볼린저
  bb_period: 20
  bb_std: 2.0
  # BB width 변동성 경고: 절대 임계치 대신, 자산 자신의 최근 bb_width_window_weeks
  # 분포 안에서 백분위로 판정 (2026-09 변경). 종목마다 BB width 스케일이 워낙
  # 달라(브렌트유 0.47 vs 원/달러 0.15 등) 절대값 하나로는 형평이 안 맞았고,
  # 실제로 옛 절대 임계치(0.8)는 대부분 종목에서 거의 발동하지 않았다.
  # price/rate 스케일 차이도 이 방식이면 자동으로 흡수돼 kind별로 나눌 필요가 없다.
  bb_width_window_weeks: 260   # 백분위 계산에 쓸 최근 기간 (약 5년)
  bb_width_warn_percentile: 95 # 이 백분위 이상이면 변동성 경고 (매매엔 개입 안 함)

  # 방향 존 히스테리시스 (히스토그램 기준, PPO 단위 %)
  hist_upper: 0.0
  hist_lower: 0.0

  # 세기 판정
  slope_window: 3      # 기울기 평균 봉 수

# 세기 3단계(강/중/약)는 실데이터 워크포워드 검증 결과 무작위와
# 구분되지 않아(단조성 충족 14%, 무작위 기대 16.7%) 폐기했다.
# 방향(매수/매도/중립)은 fast/slow/signal/RSI 임계값으로만 정해지는
# 순수 규칙 기반이라 데이터로 학습하는 값이 없다 — 캘리브레이션 불필요.

